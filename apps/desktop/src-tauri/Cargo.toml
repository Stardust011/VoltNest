[package]
name = "voltnest-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VoltNest 桌面应用：组合 Provider 线程组、核心状态机与 Tauri 外壳"

[build-dependencies]
tauri-build = { version = ">=2.7.4", features = [] }

[dependencies]
voltnest-provider = { workspace = true }
voltnest-core = { workspace = true }
voltnest-hid = { workspace = true }
voltnest-ble = { workspace = true }
voltnest-platform = { workspace = true }
voltnest-storage = { workspace = true }
voltnest-floating = { workspace = true }

serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true, features = ["std"] }

tauri = { version = ">=2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-notification = ">=2.7.0"

# Windows Toast 直接走 WinRT：插件在 `target\debug` / `target\release` 下不给
# AUMID，通知会被系统记成 powershell.exe 发的（见 notification.rs 顶部说明）。
[target.'cfg(windows)'.dependencies]
tauri-winrt-notification = ">=0.8.1"

[lints.rust]
# MSVC 的 link.exe 每轮都会把「正在创建库 …lib / …exp」写进 stdout，
# rustc 1.9x 起把它当 warning 打出来，刷屏且没有信息量。
linker_messages = "allow"
