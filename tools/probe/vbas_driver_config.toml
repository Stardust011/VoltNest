# AJAZZ 官方驱动 config.xml 的标准化 TOML 形式
# 源文件   : config.xml（驱动安装目录，由环境变量 AJAZZ_DRIVER_DIR 指定）
# 源版本   : 1.0.7.6
# 生成方式 : tools/probe/xml_to_toml.py（勿手改，改脚本后重新生成）
#
# 结构映射：
#   <config>/<device>/<mouse @name @device_type ...>  -> [[device.mouse]]
#   <mouse>/<mode @value @desc @vid @pid ...>         -> [[device.mouse.mode]]
#   <config>/<software>                               -> [software]
#   vid / pid 以 0x 十六进制整数写出；device_type / value 为十进制整数。

[meta]
schema = "voltnest.vbas.driver-config"
schema_version = 1
generated_by = "tools/probe/xml_to_toml.py"
source_file = "config.xml"
source_sha256 = "11bced0d4a56e0f940c31b39567a26ed7bf130fa44ec15407e86ce1ab39b1581"
strict_xml = false
repairs_applied = ["escape-bare-ampersand"]
bare_amp_lines = [5, 6, 9, 10, 13, 14, 17, 18, 21, 22, 25, 26, 29, 30, 33, 34]
device_count = 8
lookup_count = 16

# config.xml 的 <device>/<mouse>：型号表，name 是界面显示名的唯一来源
