[workspace]
resolver = "3"
members = ["crates/*", "apps/desktop/src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
authors = ["VoltNest contributors"]
repository = "https://example.invalid/voltnest"

[workspace.dependencies]
voltnest-provider = { path = "crates/voltnest-provider" }
voltnest-core = { path = "crates/voltnest-core" }
voltnest-hid = { path = "crates/voltnest-hid" }
voltnest-ble = { path = "crates/voltnest-ble" }
voltnest-platform = { path = "crates/voltnest-platform" }
voltnest-storage = { path = "crates/voltnest-storage" }

serde = { version = ">=1.0.229", features = ["derive"] }
serde_json = { version = ">=1.0.154", features = ["preserve_order"] }
log = ">=0.4.34"

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = "s"
strip = "symbols"
# 不要设置 panic = "abort"：采集线程靠 catch_unwind 做故障隔离，
# unwind 表被裁掉后单个 transport 的 panic 会直接带走整个进程。

