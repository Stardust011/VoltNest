[package]
name = "voltnest-ble"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VoltNest BLE Provider（ble-bas）：发现、连接、通知、轮询与解析"

[dependencies]
voltnest-provider.workspace = true

btleplug = { version = ">=0.13.5", features = ["serde"] }
futures = ">=0.3.34"
log = { workspace = true }
tokio = { version = ">=1.54.1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = ">=1.29.0"
