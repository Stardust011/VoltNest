[package]
name = "voltnest-ble"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VoltNest BLE Provider（ble-bas）：发现、连接、通知、轮询与解析"

[dependencies]
voltnest-provider.workspace = true

# 锁定 btleplug 0.13.x：Windows 后端在 0.13 才提供 Uncached 读取路径，
# 行为依赖较深，不接受 minor 版本自动上浮。
# 平台差异全部由 btleplug 内部分支承担（Windows 走 WinRT，Linux 走 bluez/dbus），
# 本 crate 只有一份版本，不按平台分叉依赖。
btleplug = { version = "~0.13", features = ["serde"] }
futures = "0.3"
log = { workspace = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros"] }
uuid = "1"
