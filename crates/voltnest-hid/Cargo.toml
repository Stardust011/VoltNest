[package]
name = "voltnest-hid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VoltNest HID Provider（hid-vbas）：通用 HID 私有协议电量采集（品牌描述 + 帧解析 + 型号表）"

[dependencies]
voltnest-provider.workspace = true
serde.workspace = true
serde_json.workspace = true

# Windows：走 hid.dll，不需要额外系统库。
[target.'cfg(windows)'.dependencies]
hidapi = { version = "~2.6", default-features = false }

# Linux：必须选 linux-static-hidraw后端
[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "~2.6", default-features = false, features = ["linux-static-hidraw"] }
