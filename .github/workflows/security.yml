name: Security

# 每周扫一次依赖与工具链漂移；rust-toolchain.toml 跟 stable 通道，stable 前进只能靠定时发现。
on:
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans licenses sources
          arguments: --all-features

  drift:
    name: toolchain drift
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev
      - name: Report toolchain
        run: rustc -vV && cargo -V
      # 新 stable 可能改变 lint 或依赖解析结果，这两步是真正的回归信号。
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # 只报告可升级项，不因有新版本而变红。
      - name: Report outdated dependencies
        continue-on-error: true
        run: cargo update --dry-run
