name: Release

# release-please 按 Conventional Commits 在 master 上维护 release PR（CHANGELOG + 版本号）；
# 合并 release PR 的那次 master push 建 tag 与 Draft Release，同一次 run 里矩阵打包把安装包挂上去。
#
# 三个入口：
# - master push：release-please 开/更新 release PR；若这次 push 就是合并 PR，则发布。
# - workflow_dispatch：手动跑一次，可填 release-as 强制版本（如 0.2.0），建的仍是 release PR。
# - v*.*.* tag push：tag 已存在，跳过 release-please，直接按该 tag 重新打包挂资产。
on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      release-as:
        description: 强制按指定版本发布（如 0.2.0），留空则由提交推导
        required: false

permissions:
  contents: write
  pull-requests: write
  # release-please 会给 release PR 打标签，走的是 issues 接口。
  issues: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    # tag push 时 tag 已存在，没有 PR 可维护，交给 bundle 直接按 tag 打包。
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release-note.outputs.release_created }}
      tag: ${{ steps.release-note.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-note
        with:
          # 用 GITHUB_TOKEN 开的 PR 不会触发 CI；配了 RELEASE_PLEASE_TOKEN（PAT）才会。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # 输入名带连字符，只能用下标访问。
          release-as: ${{ inputs['release-as'] }}

  bundle:
    name: bundle (${{ matrix.target }})
    needs: release-please
    # release-please 在 tag push 时被跳过，outputs 为空，故先 always 兜住再按事件判定。
    if: |
      always() && !cancelled()
      && (needs.release-please.outputs.released == 'true' || github.ref_type == 'tag')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      # 不按 tag 显式 checkout：master push 触发时 draft release 发布前 GitHub 还没建这个 tag，
      # 此时 HEAD 就是刚合并的 release PR，与 tag 指向同一提交；tag push 触发时 HEAD 已是该 tag。
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # Tauri 打包期依赖：webkit2gtk / gtk3 / libsoup3、托盘、bluez、libudev。
      - name: Install Linux bundling dependencies
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev patchelf

      # 锁文件在仓库根，安装必须在根跑；beforeBuildCommand 由 tauri-action 在 apps/desktop 执行。
      - run: pnpm install --frozen-lockfile
        working-directory: .

      # beforeBuildCommand（npm run build）由 tauri-action 负责执行。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          # 只按 tag 找 release-please 建好的 draft 上传安装包；
          # tag push 重打包时 release-please 没有输出，直接用当前 ref。
          # 不传 releaseName / releaseBody：正文来自 CHANGELOG，v1 的 updateRelease 会用空串覆盖。
          tagName: ${{ needs.release-please.outputs.tag || github.ref_name }}
          releaseDraft: true
          # v1 不做签名与自动更新，latest.json 没有可用的签名，不上传。
          uploadUpdaterJson: false

      - name: Upload bundles as run artifact
        uses: actions/upload-artifact@v7
        with:
          name: voltnest-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
