name: Release

# 版本号、tag 与 Release 正文由 release-please 生成；本工作流只做双平台打包。
on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # release-please 不改 Cargo.lock，这里把版本对齐后 amend 进 release PR 提交。
      - uses: actions/checkout@v7
        if: steps.release.outputs.release_created != 'true'
        with:
          fetch-depth: 0

      - name: Align Cargo.lock and amend the release commit
        if: steps.release.outputs.release_created != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="release-please--branches--master"
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "No pending release branch, skipping."
            exit 0
          fi
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          python3 scripts/sync-cargo-lock-version.py
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync, skipping."
            exit 0
          fi
          python3 scripts/amend-release-commit.py "$branch" Cargo.lock

  bundle:
    name: bundle (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # Tauri 打包期依赖。
      - name: Install Linux bundling dependencies
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev patchelf

      # 锁文件在仓库根，安装需在根目录执行。
      - run: pnpm install --frozen-lockfile
        working-directory: .

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          tagName: ${{ needs.release-please.outputs.tag }}
          releaseDraft: true
          prerelease: false

      - name: Upload bundles as run artifact
        uses: actions/upload-artifact@v7
        with:
          name: voltnest-${{ matrix.target }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
