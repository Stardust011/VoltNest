name: Release

# release-please 按 Conventional Commits 在 master 上维护 release PR（CHANGELOG + 版本号）；
# 合并 release PR 的那次 master push 建 tag 与 Draft Release，同一次 run 里矩阵打包把安装包挂上去。
#
# 三个入口：
# - master push：release-please 开/更新 release PR；若这次 push 就是合并 PR，则发布。
# - workflow_dispatch：手动跑一次，可填 release-as 强制版本（如 0.2.0），建的仍是 release PR。
# - v*.*.* tag push：tag 已存在，跳过 release-please，直接按该 tag 重新打包挂资产。
on:
  push:
    branches: [master]
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]
  workflow_dispatch:
    inputs:
      release-as:
        description: 强制按指定版本发布（如 0.2.0），留空则由提交推导
        required: false

permissions:
  contents: write
  pull-requests: write
  # release-please 会给 release PR 打标签，走的是 issues 接口。
  issues: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    # tag push 时 tag 已存在，没有 PR 可维护，交给 bundle 直接按 tag 打包。
    if: github.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      released: ${{ steps.release-note.outputs.release_created }}
      tag: ${{ steps.release-note.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-note
        with:
          # 用 GITHUB_TOKEN 开的 PR 不会触发 CI；配了 RELEASE_PLEASE_TOKEN（PAT）才会。
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # 输入名带连字符，只能用下标访问。
          release-as: ${{ inputs['release-as'] }}

      # release-please 的 extra-files 处理不了 Cargo.lock（带 [@] 的 jsonpath 会被拆坏），
      # 改为在 release PR 分支上对齐锁文件，再 amend 回 release-please 的提交，
      # 使 PR 里只有 chore(master): release X.Y.Z 这一个提交。
      - uses: actions/checkout@v4
        if: steps.release-note.outputs.released != 'true'
        with:
          fetch-depth: 0

      - name: 检出 release PR 分支并同步 Cargo.lock
        id: lock
        if: steps.release-note.outputs.released != 'true'
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
          GPG_EMAIL: ${{ secrets.GPG_EMAIL }}
        run: |
          set -euo pipefail
          echo "skip=true" >> "$GITHUB_OUTPUT"
          branch="release-please--branches--master"
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "没有待处理的 release 分支，跳过"
            exit 0
          fi
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          python3 scripts/sync-cargo-lock-version.py
          git add Cargo.lock
          echo "skip=false" >> "$GITHUB_OUTPUT"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          ORIGINAL_MSG=$(git log -1 --format=%B | grep -v -i "co-authored-by" | grep -v -i "signed-off-by" || true)
          git commit --amend --reset-author --no-edit -m "$ORIGINAL_MSG"
          git push origin "$branch" --force-with-lease

  bundle:
    name: bundle (${{ matrix.target }})
    needs: release-please
    if: |
      always() && !cancelled()
      && (needs.release-please.outputs.released == 'true' || github.ref_type == 'tag')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      # 不按 tag 显式 checkout：master push 触发时 draft release 发布前 GitHub 还没建这个 tag，
      # 此时 HEAD 就是刚合并的 release PR，与 tag 指向同一提交；tag push 触发时 HEAD 已是该 tag。
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
          # tag 触发的缓存只被同名 tag 可见，每次发布都是新 tag，落盘即死缓存。
          save-if: ${{ github.ref_type == 'branch' }}

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          save-cache: ${{ github.ref_type == 'branch' }}
          cache-dependency-path: pnpm-lock.yaml
          install: false

      # Tauri 打包期依赖：webkit2gtk / gtk3 / libsoup3、托盘、bluez、libudev。
      - name: Install Linux bundling dependencies
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev patchelf

      # 锁文件在仓库根，安装必须在根跑；beforeBuildCommand 由 tauri-action 在 apps/desktop 执行。
      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Import Windows certificate (In-Memory)
        if: matrix.platform == 'windows'
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $pfx_bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force

          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import($pfx_bytes, $password, [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::EphemeralKeySet)

          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "CurrentUser")
          $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $store.Add($cert)
          $store.Close()

          Write-Output "Certificate successfully imported."

          $thumbprint = $cert.Thumbprint.ToUpper()
          Write-Output "Certificate Thumbprint: $thumbprint"

          $digestAlg = "sha256"

          $customSignCmd = "signtool sign /sha1 $thumbprint /fd $digestAlg /td $digestAlg /tr http://timestamp.digicert.com %1"
          $configPath = "apps/desktop/src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.windows.signCommand = $signCommand
          $config | ConvertTo-Json -Depth 10 | Set-Content $configPath -Encoding utf8

      # beforeBuildCommand（npm run build）由 tauri-action 负责执行。
      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          # 只按 tag 找 release-please 建好的 draft 上传安装包；
          # tag push 重打包时 release-please 没有输出，直接用当前 ref。
          # 不传 releaseName / releaseBody：正文来自 CHANGELOG，v1 的 updateRelease 会用空串覆盖。
          tagName: ${{ needs.release-please.outputs.tag || github.ref_name }}
          releaseDraft: true
          # v1 不做签名与自动更新，latest.json 没有可用的签名，不上传。
          uploadUpdaterJson: false

      - name: Upload bundles as run artifact
        uses: actions/upload-artifact@v7
        with:
          name: voltnest-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
