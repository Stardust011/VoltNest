name: Release

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write
  # release-please 给 release PR 打标签走 issues 接口。
  issues: write

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      released: ${{ steps.release-note.outputs.release_created }}
      tag: ${{ steps.release-note.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release-note
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - uses: actions/checkout@v7
        if: steps.release-note.outputs.released != 'true'
        with:
          fetch-depth: 0

      - name: Align Cargo.lock and amend the release commit
        if: steps.release-note.outputs.released != 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          branch="release-please--branches--master"
          if ! git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            echo "No pending release branch, skipping."
            exit 0
          fi
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          python3 scripts/sync-cargo-lock-version.py
          if git diff --quiet -- Cargo.lock; then
            echo "Cargo.lock already in sync, skipping."
            exit 0
          fi
          python3 scripts/amend-release-commit.py "$branch" Cargo.lock

  bundle:
    name: bundle (${{ matrix.target }})
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            platform: windows
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            platform: linux
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install Linux bundling dependencies
        if: matrix.platform == 'linux'
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev patchelf

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Locate signtool and add to PATH
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          if (Get-Command signtool.exe -ErrorAction SilentlyContinue) {
            exit 0
          }

          $sdkBin = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\bin'
          if (-not (Test-Path $sdkBin)) {
            throw "Windows SDK bin not exist: $sdkBin"
          }

          $signtoolDir = Get-ChildItem $sdkBin -Directory |
            Where-Object { $_.Name -match '^\d+\.\d+\.\d+\.\d+$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName 'x64' } |
            Where-Object { Test-Path (Join-Path $_ 'signtool.exe') } |
            Select-Object -First 1

          if (-not $signtoolDir) {
            throw "signtool.exe not found in Windows SDK bin directories"
          }

          Write-Output "Using signtool directory: $signtoolDir"
          $signtoolDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Import Windows certificate
        if: matrix.platform == 'windows'
        shell: powershell
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $flags = [System.Security.Cryptography.X509Certificates.X509KeyStorageFlags]::PersistKeySet
          $pfx_bytes = [System.Convert]::FromBase64String($env:WINDOWS_CERTIFICATE)
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force

          $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2
          $cert.Import($pfx_bytes, $password, $flags)

          $store = New-Object System.Security.Cryptography.X509Certificates.X509Store("My", "CurrentUser")
          $store.Open([System.Security.Cryptography.X509Certificates.OpenFlags]::ReadWrite)
          $store.Add($cert)
          $store.Close()

          $thumbprint = $cert.Thumbprint.ToUpper()
          Write-Output "Certificate Thumbprint: $thumbprint"

          $signCommand = [pscustomobject]@{
            cmd  = "signtool"
            args = @(
              "sign", "/sha1", $thumbprint,
              "/fd", "sha256", "/td", "sha256",
              "/tr", "http://timestamp.digicert.com", "%1"
            )
          }

          $configPath = "src-tauri/tauri.conf.json"
          $config = Get-Content $configPath -Raw | ConvertFrom-Json
          $config.bundle.windows | Add-Member -NotePropertyName signCommand -NotePropertyValue $signCommand -Force
          $json = $config | ConvertTo-Json -Depth 20
          [System.IO.File]::WriteAllText((Resolve-Path $configPath), $json, (New-Object System.Text.UTF8Encoding($false)))

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: --target ${{ matrix.target }}
          # 不传 releaseName / releaseBody：正文来自 CHANGELOG，v1 的 updateRelease 会用空串覆盖。
          tagName: ${{ needs.release-please.outputs.tag }}
          releaseDraft: true
          # v1 不做签名与自动更新，latest.json 没有可用的签名，不上传。
          uploadUpdaterJson: false

      - name: Upload bundles as run artifact
        uses: actions/upload-artifact@v7
        with:
          name: voltnest-${{ matrix.target }}
          if-no-files-found: error
          path: |
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
