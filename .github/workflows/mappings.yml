name: Mappings

# 每月抓取厂商网页驱动里的型号表，有变化就开 PR。
on:
  schedule:
    # 每月 1 日 03:00 UTC（北京时间 11:00）
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      brand:
        description: 只抓某个品牌
        type: choice
        default: all
        options: [all, dareu, mchose, rapoo]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mappings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh mappings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
      # 与 CI 共用同一条缓存，只读不写：每月跑一次，自建缓存必然活不过 7 天淘汰线。
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-test
          save-if: "false"

      # hidapi 的 hidraw 后端构建期需要 libudev 开发文件。
      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev

      # PR 正文直接读这个文件，先建空文件避免 action 因文件缺失报错。
      - name: Prepare report file
        run: truncate -s 0 "$RUNNER_TEMP/report.md"

      # 单品牌失败只跳过该品牌：旧表留着也比没有表强，失败率由最后一步汇总暴露。
      # 只有 devices 内容变化才落盘；仅 config_version / source 变化不算，不会开 PR。
      # 报告每品牌一行，原样进 PR 正文与 run summary，不写任何其它说明。
      - name: Fetch mappings
        id: fetch
        shell: bash
        run: |
          set -u
          report="$RUNNER_TEMP/report.md"
          brands="${{ inputs.brand }}"
          if [ -z "$brands" ] || [ "$brands" = "all" ]; then
            brands="dareu mchose rapoo"
          fi
          failed=0
          changed=0
          for brand in $brands; do
            dest="crates/voltnest-hid/data/mappings/${brand}.json"
            tmp="$RUNNER_TEMP/${brand}.json"
            if ! timeout 600 python "mappings/scripts/${brand}_device_map.py" -q -o "$tmp"; then
              echo "::warning title=${brand} 抓取失败::沿用仓库内旧表"
              echo "${brand}：抓取失败，未更新" >> "$report"
              failed=1
              continue
            fi
            # 0 = devices 有变化；3 = 与旧表一致（保留旧表与其抓取时刻）；其它 = 表非法
            rc=0
            python mappings/scripts/mapping_report.py "$tmp" --old "$dest" --require-change >> "$report" || rc=$?
            if [ "$rc" -eq 0 ]; then
              cp "$tmp" "$dest"
              changed=1
            elif [ "$rc" -ne 3 ]; then
              echo "::error title=${brand} 输出非法::沿用仓库内旧表"
              failed=1
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      # 抓取脚本产出的是 json.dumps 原始排版，落盘前统一成仓库 prettier 口径。
      - uses: pnpm/setup@v3
        if: steps.fetch.outputs.changed == '1'
        with:
          runtime: node@24
          # 只跑 pnpm dlx，不装工作区依赖。
          install: false

      - name: Format tables
        if: steps.fetch.outputs.changed == '1'
        run: pnpm dlx prettier@3.9.10 --write crates/voltnest-hid/data/mappings

      # 型号表格式由 crate 的测试守，不靠抓取脚本自证。
      - name: Verify tables parse
        id: verify
        if: steps.fetch.outputs.changed == '1'
        continue-on-error: true
        run: cargo test -p voltnest-hid

      # 上次检测的 PR 可能一直没合并，旧分支上的表会挡在本次结果前面。
      # 先把分支强推回当前基线，让本次抓取整体覆盖旧内容，而不是叠在旧提交上。
      - name: Force-reset pull request branch
        if: steps.fetch.outputs.changed == '1'
        run: |
          set -euo pipefail
          branch=chore/mappings-refresh
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git push --force origin "HEAD:refs/heads/$branch"
          fi

      - name: Create pull request
        if: always()
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/mappings-refresh
          delete-branch: true
          add-paths: crates/voltnest-hid/data/mappings/
          commit-message: "chore(mappings): 同步厂商型号表"
          title: "chore(mappings): 同步厂商型号表"
          # 正文就是逐品牌摘要，不加任何其它说明。
          body-path: ${{ runner.temp }}/report.md
          labels: dependencies
          sign-commits: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on partial refresh
        if: always() && (steps.fetch.outputs.failed == '1' || steps.verify.outcome == 'failure')
        run: |
          echo "抓取或解析校验未通过，详见上方日志与 Summary" >&2
          exit 1
