name: Mappings

on:
  schedule:
    # 每月 1 日 03:00 UTC（北京时间 11:00）
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      brand:
        description: 只抓某个品牌
        type: choice
        default: all
        options: [all, dareu, mchose, rapoo]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mappings-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: refresh mappings
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-test
          save-if: "false"

      - name: Install libudev
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev

      - name: Prepare report file
        run: truncate -s 0 "$RUNNER_TEMP/report.md"

      - name: Fetch mappings
        id: fetch
        shell: bash
        run: |
          set -u
          report="$RUNNER_TEMP/report.md"
          brands="${{ inputs.brand }}"
          if [ -z "$brands" ] || [ "$brands" = "all" ]; then
            brands="dareu mchose rapoo"
          fi
          failed=0
          changed=0
          for brand in $brands; do
            dest="crates/voltnest-hid/data/mappings/${brand}.json"
            tmp="$RUNNER_TEMP/${brand}.json"
            if ! timeout 600 python "mappings/scripts/${brand}_device_map.py" -q -o "$tmp"; then
              echo "::warning title=${brand} 抓取失败::沿用仓库内旧表"
              echo "${brand}：抓取失败，未更新" >> "$report"
              failed=1
              continue
            fi
            # 0=devices 有变化；3=与旧表一致；其它=表非法
            rc=0
            python mappings/scripts/mapping_report.py "$tmp" --old "$dest" --require-change >> "$report" || rc=$?
            if [ "$rc" -eq 0 ]; then
              cp "$tmp" "$dest"
              changed=1
            elif [ "$rc" -ne 3 ]; then
              echo "::error title=${brand} 输出非法::沿用仓库内旧表"
              failed=1
            fi
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

      - uses: pnpm/setup@v3
        if: steps.fetch.outputs.changed == '1'
        with:
          runtime: node@24
          install: false

      - name: Format tables
        if: steps.fetch.outputs.changed == '1'
        run: pnpm dlx prettier@3.9.10 --write crates/voltnest-hid/data/mappings

      - name: Verify tables parse
        id: verify
        if: steps.fetch.outputs.changed == '1'
        continue-on-error: true
        run: cargo test -p voltnest-hid

      - name: Force-reset pull request branch
        if: steps.fetch.outputs.changed == '1'
        run: |
          set -euo pipefail
          branch=chore/mappings-refresh
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            git push --force origin "HEAD:refs/heads/$branch"
          fi

      - name: Create pull request
        if: always()
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/mappings-refresh
          delete-branch: true
          add-paths: crates/voltnest-hid/data/mappings/
          commit-message: "chore(mappings): 同步厂商型号表"
          title: "chore(mappings): 同步厂商型号表"
          body-path: ${{ runner.temp }}/report.md
          labels: dependencies
          sign-commits: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail on partial refresh
        if: always() && (steps.fetch.outputs.failed == '1' || steps.verify.outcome == 'failure')
        run: |
          echo "抓取或解析校验未通过，详见上方日志与 Summary" >&2
          exit 1
