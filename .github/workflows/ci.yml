name: CI

on:
  push:
    branches: [master]
  pull_request:
    # 文档改动不触发全量流水线
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # Rust formatting
  # --------------------------------------------------
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all --check

      # rust-toolchain.toml 锁定 stable 通道，最低版本在这里断言。
      - name: Assert rustc >= 1.98
        shell: bash
        run: |
          rustc -vV
          required=1.98
          current=$(rustc --version | awk '{print $2}')
          lowest=$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -1)
          if [ "$lowest" != "$required" ]; then
            echo "rustc $current < $required" >&2
            exit 1
          fi

  # --------------------------------------------------
  # Python formatting
  # --------------------------------------------------
  fmt-python:
    name: ruff format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Ruff
        run: pip install ruff

      - name: Check Python formatting
        run: ruff format --check mappings/scripts/

  # --------------------------------------------------
  # Windows Clippy
  # Share the Debug Rust cache with Windows package tests.
  # --------------------------------------------------
  clippy-windows:
    name: clippy (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-debug
          cache-on-failure: true

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # --------------------------------------------------
  # Windows package tests
  # Keep matrix parallelism to minimize PR feedback time.
  # --------------------------------------------------
  test-windows:
    name: cargo test (windows, ${{ matrix.package }})
    strategy:
      fail-fast: true
      matrix:
        package:
          - voltnest-core
          - voltnest-hid
          - voltnest-ble
          - voltnest-provider
          - voltnest-platform
          - voltnest-storage
          - voltnest-desktop

    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-debug
          cache-on-failure: true

      - name: Run package tests
        run: cargo test -p ${{ matrix.package }}

  # --------------------------------------------------
  # Windows release build
  # Keep Release artifacts separate from Debug artifacts.
  # --------------------------------------------------
  build-smoke:
    name: release build (windows)
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-release
          cache-on-failure: true

      - name: Build workspace in release mode
        run: cargo build --workspace --release
        env:
          CARGO_INCREMENTAL: 0

  # --------------------------------------------------
  # Linux Clippy + tests
  # --------------------------------------------------
  clippy-test-linux:
    name: clippy + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-debug
          cache-on-failure: true

      # Native dependencies required by Tauri, hidapi, tray,
      # Bluetooth and notification backends.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

  # --------------------------------------------------
  # Coverage gates
  # Keep coverage artifacts separate from ordinary test builds.
  # --------------------------------------------------
  coverage:
    name: coverage gate
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-coverage
          cache-on-failure: true

      - uses: taiki-e/install-action@cargo-llvm-cov

      # voltnest-ble 经 btleplug 走 bluez/dbus，需要 dbus-1.pc。
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libdbus-1-dev \
            pkg-config

      - name: Coverage - voltnest-core
        run: cargo llvm-cov -p voltnest-core --fail-under-lines 90

      - name: Coverage - voltnest-hid
        run: cargo llvm-cov -p voltnest-hid --fail-under-lines 85

      - name: Coverage - voltnest-ble
        run: cargo llvm-cov -p voltnest-ble --fail-under-lines 85

      - name: Coverage - voltnest-provider
        run: cargo llvm-cov -p voltnest-provider --fail-under-lines 90

  # --------------------------------------------------
  # Frontend
  # --------------------------------------------------
  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # pnpm 版本取自 package.json 的 packageManager 字段；Node 由同一步安装。
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm run format:check:web

      - name: Check repository formatting
        run: pnpm run format:check:repo

      - name: Run frontend tests
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build
