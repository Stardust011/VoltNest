name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  # 两个平台都要跑：项目已双平台，#[cfg(windows)]（Toast / AUMID / 托盘气泡）与
  # #[cfg(not(windows))]（notification 插件 / hidraw / bluez）是两组互斥代码，只有各自的
  # runner 会真正编译并 lint 它们。clippy.toml 把 SystemTime 列为禁用类型的门禁两边同样有效。
  clippy-windows:
    name: clippy (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-windows:
    name: cargo test (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  clippy-test-linux:
    name: clippy + test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 构建期依赖：libudev（hidapi 的 hidraw 后端用 pkg-config 探测）、Tauri 的
      # webkit2gtk / gtk3 / libsoup3、托盘（libayatana-appindicator3）、bluez 与通知（dbus）。
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    name: coverage gate
    # 覆盖率只对纯逻辑与解析器设门槛；platform / Tauri / 托盘光栅
    # 走手工验收，不在这里衡量。
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@cargo-llvm-cov
      # hidapi 的 hidraw 后端在构建期用 pkg-config 探测 libudev（libudev.pc + libudev.h）；
      # 覆盖率门禁会真编 voltnest-hid / voltnest-ble，故这里同样要装开发文件。
      - name: Install libudev (hidapi build dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      - run: cargo llvm-cov -p voltnest-core --fail-under-lines 90
      - run: cargo llvm-cov -p voltnest-hid --fail-under-lines 85
      - run: cargo llvm-cov -p voltnest-ble --fail-under-lines 85
      - run: cargo llvm-cov -p voltnest-provider --fail-under-lines 90

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - run: npm ci
      # Rust 侧的格式由上面的 `rustfmt` job 负责；本 job 没有 Rust 工具链。
      - run: npm run format:check:web
      - run: npm run test
      - run: npm run build
