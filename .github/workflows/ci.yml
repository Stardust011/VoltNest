name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # Change detection
  # 只有受影响的区域才跑对应 job；workflow_dispatch 全部视为 true。
  # --------------------------------------------------
  changes:
    name: detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            rust:
              - "crates/**"
              - "apps/desktop/src-tauri/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              - "clippy.toml"
              - "deny.toml"
              - ".github/workflows/ci.yml"
            web:
              - "apps/desktop/src/**"
              - "apps/desktop/index.html"
              - "apps/desktop/public/**"
              - "apps/desktop/package.json"
              - "apps/desktop/vite.config.*"
              - "apps/desktop/tsconfig*.json"
              - "apps/desktop/*.config.*"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"
            python:
              - "mappings/scripts/**"
              - ".github/workflows/ci.yml"

  # --------------------------------------------------
  # Formatting (Rust + Python)
  # 两者都是秒级检查，合成一个 job 省一次排队与 setup。
  # --------------------------------------------------
  fmt:
    name: format
    needs: changes
    if: needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
        with:
          components: rustfmt

      - name: Check Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check

      # rust-toolchain.toml 锁定 stable 通道，最低版本在这里断言。
      - name: Assert rustc >= 1.98
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          rustc -vV
          required=1.98
          current=$(rustc --version | awk '{print $2}')
          lowest=$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -1)
          if [ "$lowest" != "$required" ]; then
            echo "rustc $current < $required" >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: "3.12"

      - name: Install Ruff
        if: needs.changes.outputs.python == 'true'
        run: pip install ruff

      - name: Check Python formatting
        if: needs.changes.outputs.python == 'true'
        run: ruff format --check mappings/scripts/

  # --------------------------------------------------
  # Windows Clippy
  # 全 workspace 的唯一 lint 入口，覆盖 cfg(windows) 分支。
  # --------------------------------------------------
  clippy-windows:
    name: clippy (windows)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-debug
          cache-on-failure: true
          # 8 个 job 共用一个键，PR 上只读不写，避免互相覆盖并挤掉已有条目。
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # --------------------------------------------------
  # Windows package tests
  # 只测平台相关 crate；voltnest-core / -provider / -storage 由 Linux
  # 的 cargo test --workspace 覆盖，不重复跑。
  # --------------------------------------------------
  test-windows:
    name: cargo test (windows, ${{ matrix.package }})
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    strategy:
      fail-fast: true
      matrix:
        package:
          - voltnest-hid
          - voltnest-ble
          - voltnest-platform
          - voltnest-desktop

    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run package tests
        run: cargo test -p ${{ matrix.package }}

  # --------------------------------------------------
  # Linux Clippy + tests
  # --------------------------------------------------
  clippy-test-linux:
    name: clippy + test (linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-debug
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Native dependencies required by Tauri, hidapi, tray,
      # Bluetooth and notification backends.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        run: cargo test --workspace

  # --------------------------------------------------
  # Frontend
  # --------------------------------------------------
  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # pnpm 版本取自 package.json 的 packageManager 字段；Node 由同一步安装。
      - uses: pnpm/setup@v1
        with:
          runtime: node@24
          cache: true
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm run format:check:web

      - name: Check repository formatting
        run: pnpm run format:check:repo

      - name: Run frontend tests
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

  # --------------------------------------------------
  # 单一必过检查
  # job 会按改动区域跳过，分支保护无法用 skipped 的 job 兜底，
  # 因此统一由这里汇总。
  # --------------------------------------------------
  ci-status:
    name: ci
    if: always()
    needs:
      - changes
      - fmt
      - clippy-windows
      - test-windows
      - clippy-test-linux
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS"
          printf '%s' "$NEEDS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = sorted(k for k, v in needs.items() if v['result'] not in ('success', 'skipped'))
          print('failed jobs:', ', '.join(bad)) if bad else print('all jobs passed or skipped')
          sys.exit(1 if bad else 0)
          "
