name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------
  # Change detection
  # --------------------------------------------------
  changes:
    name: detect changes
    # 需读 PR 改动文件列表。
    permissions:
      contents: read
      pull-requests: read
    if: |
      github.event_name != 'pull_request'
      || (
        !startsWith(github.head_ref, 'release-please--')
        && github.event.pull_request.user.login != 'release-please[bot]'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      changelog: ${{ steps.filter.outputs.changelog }}
      rust: ${{ steps.filter.outputs.rust }}
      web: ${{ steps.filter.outputs.web }}
      python: ${{ steps.filter.outputs.python }}
    steps:
      - uses: actions/checkout@v7

      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            changelog:
              - "CHANGELOG.md"
            rust:
              - "crates/**"
              - "apps/desktop/src-tauri/**"
              - "Cargo.toml"
              - "Cargo.lock"
              - "rust-toolchain.toml"
              - "rustfmt.toml"
              - "clippy.toml"
              - "deny.toml"
              - ".github/workflows/ci.yml"
            web:
              - "apps/desktop/src/**"
              - "apps/desktop/index.html"
              - "apps/desktop/public/**"
              - "apps/desktop/package.json"
              - "apps/desktop/vite.config.*"
              - "apps/desktop/tsconfig*.json"
              - "apps/desktop/*.config.*"
              - "package.json"
              - "pnpm-lock.yaml"
              - "pnpm-workspace.yaml"
              - ".github/workflows/ci.yml"
            python:
              - "mappings/scripts/**"
              - "**/*.py"
              - ".ruff.toml"
              - ".github/workflows/ci.yml"

  # --------------------------------------------------
  # Windows Clippy
  # --------------------------------------------------
  clippy-windows:
    name: clippy (windows)
    needs: changes
    if: needs.changes.outputs.changelog != 'true' && needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-clippy
          cache-on-failure: true
          # 仅 master 写缓存。
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # --------------------------------------------------
  # Windows package tests
  # --------------------------------------------------
  test-windows:
    name: cargo test (windows)
    needs: changes
    if: needs.changes.outputs.changelog != 'true' && needs.changes.outputs.rust == 'true'
    runs-on: windows-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-test
          cache-on-failure: true
          # 仅 master 写缓存。
          save-if: ${{ github.ref == 'refs/heads/master' }}

      - name: Run package tests
        run: >-
          cargo test
          -p voltnest-hid
          -p voltnest-ble
          -p voltnest-platform
          -p voltnest-desktop

  # --------------------------------------------------
  # Linux 格式 + Clippy + 测试
  # --------------------------------------------------
  clippy-test-linux:
    name: lint + test (linux)
    needs: changes
    if: needs.changes.outputs.changelog != 'true' && (needs.changes.outputs.rust == 'true' || needs.changes.outputs.python == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        if: needs.changes.outputs.rust == 'true'
        with:
          components: clippy,rustfmt

      - name: Check Rust formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --all --check

      # 最低 rustc 版本断言。
      - name: Assert rustc >= 1.98
        if: needs.changes.outputs.rust == 'true'
        shell: bash
        run: |
          rustc -vV
          required=1.98
          current=$(rustc --version | awk '{print $2}')
          lowest=$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -1)
          if [ "$lowest" != "$required" ]; then
            echo "rustc $current < $required" >&2
            exit 1
          fi

      - uses: actions/setup-python@v7
        if: needs.changes.outputs.python == 'true'
        with:
          python-version: "3.12"

      - name: Install Ruff
        if: needs.changes.outputs.python == 'true'
        run: pip install ruff

      - name: Check Python formatting
        if: needs.changes.outputs.python == 'true'
        # 全仓 Python。
        run: ruff format --check .

      - uses: Swatinem/rust-cache@v2
        if: needs.changes.outputs.rust == 'true'
        with:
          shared-key: linux-test
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/master' }}

      # Tauri / hidapi / 托盘 / 蓝牙的本地依赖。
      - name: Install Linux build dependencies
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev \
            libdbus-1-dev \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev

      - name: Run Clippy
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run workspace tests
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --workspace

  # --------------------------------------------------
  # Frontend
  # --------------------------------------------------
  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.changelog != 'true' && needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      # pnpm 版本取自 package.json 的 packageManager 字段。
      - uses: pnpm/setup@v3
        with:
          runtime: node@24
          cache: true
          # 仅 master 写缓存。
          save-cache: ${{ github.ref == 'refs/heads/master' }}
          cache-dependency-path: pnpm-lock.yaml
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check frontend formatting
        run: pnpm run format:check:web

      - name: Check repository formatting
        run: pnpm run format:check:repo

      - name: Run frontend tests
        run: pnpm run test

      - name: Build frontend
        run: pnpm run build

  # --------------------------------------------------
  # 单一必过检查
  # --------------------------------------------------
  ci-status:
    name: ci
    if: always() && needs.changes.outputs.changelog != 'true'
    needs:
      - changes
      - clippy-windows
      - test-windows
      - clippy-test-linux
      - frontend
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS"
          printf '%s' "$NEEDS" | python3 -c "
          import json, sys
          needs = json.load(sys.stdin)
          bad = sorted(k for k, v in needs.items() if v['result'] not in ('success', 'skipped'))
          print('failed jobs:', ', '.join(bad)) if bad else print('all jobs passed or skipped')
          sys.exit(1 if bad else 0)
          "
