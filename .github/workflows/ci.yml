name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      # rust-toolchain.toml 只锁 stable 通道，最低版本在这里断言。
      - name: Assert rustc >= 1.98
        shell: bash
        run: |
          rustc -vV
          required=1.98
          current=$(rustc --version | awk '{print $2}')
          lowest=$(printf '%s\n%s\n' "$required" "$current" | sort -V | head -1)
          if [ "$lowest" != "$required" ]; then
            echo "rustc $current < $required" >&2
            exit 1
          fi

  # 版本锁死，格式化结果才与本地一致。
  fmt-python:
    name: ruff format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install ruff==0.16.7
      - run: ruff format --check mappings/scripts/

  # 两个平台都要跑：项目已双平台，#[cfg(windows)]（Toast / AUMID / 托盘气泡）与
  # #[cfg(not(windows))]（notification 插件 / hidraw / bluez）是两组互斥代码，只有各自的
  # runner 会真正编译并 lint 它们。clippy.toml 把 SystemTime 列为禁用类型的门禁两边同样有效。
  clippy-windows:
    name: clippy (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test-windows:
    name: cargo test (windows)
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace

  # clippy 只做 check；release profile 的 lto / strip / panic 策略只有真链接才会暴露问题。
  build-smoke:
    name: release build (windows)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --release
        env:
          CARGO_INCREMENTAL: 0

  clippy-test-linux:
    name: clippy + test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # 构建期依赖：libudev（hidapi 的 hidraw 后端用 pkg-config 探测）、Tauri 的
      # webkit2gtk / gtk3 / libsoup3、托盘（libayatana-appindicator3）、bluez 与通知（dbus）。
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libudev-dev libdbus-1-dev libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev \
            libayatana-appindicator3-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  coverage:
    name: coverage gate
    # 覆盖率只对纯逻辑与解析器设门槛；platform / Tauri / 托盘光栅
    # 走手工验收，不在这里衡量。
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - uses: taiki-e/install-action@cargo-llvm-cov
      # hidapi 的 hidraw 后端在构建期用 pkg-config 探测 libudev（libudev.pc + libudev.h）；
      # 覆盖率门禁会真编 voltnest-hid / voltnest-ble，故这里同样要装开发文件。
      - name: Install libudev (hidapi build dependency)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libudev-dev
      - run: cargo llvm-cov -p voltnest-core --fail-under-lines 90
      - run: cargo llvm-cov -p voltnest-hid --fail-under-lines 85
      - run: cargo llvm-cov -p voltnest-ble --fail-under-lines 85
      - run: cargo llvm-cov -p voltnest-provider --fail-under-lines 90

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # 版本取自根 package.json 的 packageManager 字段。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # Rust 侧的格式由上面的 `rustfmt` job 负责；本 job 没有 Rust 工具链。
      - run: pnpm run format:check:web
      # 仓库根目录的 Markdown / JSON / YAML。
      - run: pnpm run format:check:repo
      - run: pnpm run test
      - run: pnpm run build
