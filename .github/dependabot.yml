version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    groups:
      rust:
        patterns: ["*"]
    ignore:
      # 0.11 的 WinRT 后端缺 retrieve_peripherals，不允许自动跳到 0.14。
      - dependency-name: btleplug
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: "/apps/desktop"
    schedule:
      interval: weekly
    groups:
      web:
        patterns: ["*"]
    ignore:
      # TypeScript 7 是原生重写版，vue-tsc 2.x 不兼容：7.0.0 及以上不提 PR，6.x 照常。
      - dependency-name: typescript
        versions: [">=7.0.0"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
