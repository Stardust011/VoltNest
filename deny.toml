# cargo-deny 配置（cargo-deny v2 schema）
[graph]
all-features = true
targets = [
  { triple = "x86_64-pc-windows-msvc" },
  { triple = "x86_64-unknown-linux-gnu" },
]

[advisories]
version = 2
unmaintained = "all"
# These are transitive dependencies with no maintained compatible replacement
# in the current Slint/Tauri Linux stacks; keep checking all other advisories.
ignore = [
  "RUSTSEC-2024-0370", # proc-macro-error
  "RUSTSEC-2026-0192", # ttf-parser
  "RUSTSEC-2026-0370", # zvariant
  "RUSTSEC-2026-0371", # zbus_names
  "RUSTSEC-2026-0372", # zvariant_derive
  "RUSTSEC-2026-0441", # pin-utils
]

[bans]
multiple-versions = "warn"
wildcards = "warn"
# btleplug 需要高于 0.13，0.11 的 WinRT 后端缺 retrieve_peripherals。
deny = [{ name = "btleplug", version = "<0.13" }]

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "LicenseRef-Slint-Royalty-free-2.0",
  "LicenseRef-Slint-Software-3.0",
  "ISC",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
